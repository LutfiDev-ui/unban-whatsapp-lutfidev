<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Unban Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #111;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #0f0;
            font-weight: bold;
        }
        
        input[type="text"], input[type="tel"], select {
            width: 100%;
            padding: 12px;
            background-color: #222;
            border: 1px solid #0f0;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
        }
        
        input[type="text"]:focus, input[type="tel"]:focus, select:focus {
            outline: none;
            box-shadow: 0 0 10px #0f0;
        }
        
        .ban-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .ban-option {
            position: relative;
        }
        
        .ban-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }
        
        .ban-option label {
            display: block;
            padding: 15px;
            background-color: #222;
            border: 2px solid #333;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .ban-option input[type="radio"]:checked + label {
            background-color: #020;
            border-color: #0f0;
            box-shadow: 0 0 10px #0f0;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #000;
            border: 2px solid #0f0;
            border-radius: 5px;
            color: #0f0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        .btn:hover {
            background-color: #020;
            box-shadow: 0 0 15px #0f0;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #0f0;
            font-size: 14px;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background-color: #020;
            border: 1px solid #0f0;
            border-radius: 5px;
            color: #0f0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            display: none;
            z-index: 1000;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid rgba(0, 255, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #0f0;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .home-container {
            text-align: center;
        }
        
        .home-btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background-color: #000;
            border: 2px solid #0f0;
            border-radius: 5px;
            color: #0f0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            text-decoration: none;
            margin-bottom: 15px;
        }
        
        .home-btn:hover {
            background-color: #020;
            box-shadow: 0 0 15px #0f0;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .ban-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Halaman Utama -->
        <div id="home-page" class="home-container">
            <h1>WhatsApp Unban | LutfiDev</h1>
            <div style="margin-top: 40px;">
                <a href="https://whatsapp.com/channel/0029VbBx5iF545uyHuvE4Q2W" class="home-btn">Masuk Saluran WhatsApp</a>
                <button id="continue-btn" class="home-btn">Lanjut</button>
            </div>
            <div class="footer">
                Created by LutfiDev
            </div>
        </div>
        
        <!-- Halaman Form Unban -->
        <div id="unban-page" style="display: none;">
            <h1>WhatsApp Unban | LutfiDev</h1>
            
            <form id="unbanForm">
                <div class="form-group">
                    <label for="phoneNumber">Nomor WhatsApp yang Dibanned:</label>
                    <input type="tel" id="phoneNumber" placeholder="Contoh: 6281234567890" required>
                </div>
                
                <div class="form-group">
                    <label>Jenis Ban:</label>
                    <div class="ban-options">
                        <div class="ban-option">
                            <input type="radio" id="spam" name="banType" value="Spam Ban">
                            <label for="spam">Spam Ban</label>
                        </div>
                        <div class="ban-option">
                            <input type="radio" id="permanen" name="banType" value="Ban Permanen">
                            <label for="permanen">Ban Permanen</label>
                        </div>
                    </div>
                </div>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Membuka aplikasi Gmail...</p>
                </div>
                
                <button type="submit" class="btn">Kirim Permintaan Unban</button>
                <button type="button" id="back-btn" class="btn" style="margin-top: 15px; background-color: #333;">Kembali</button>
            </form>
            
            <div class="footer">
                Created by LutfiDev
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">
        Permintaan unban telah dikirim ke WhatsApp Support!
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const homePage = document.getElementById('home-page');
            const unbanPage = document.getElementById('unban-page');
            const continueBtn = document.getElementById('continue-btn');
            const backBtn = document.getElementById('back-btn');
            const unbanForm = document.getElementById('unbanForm');
            
            // Navigasi ke halaman unban
            continueBtn.addEventListener('click', function() {
                homePage.style.display = 'none';
                unbanPage.style.display = 'block';
            });
            
            // Kembali ke halaman utama
            backBtn.addEventListener('click', function() {
                unbanPage.style.display = 'none';
                homePage.style.display = 'block';
            });
            
            // Proses formulir unban
            unbanForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const phoneNumber = document.getElementById('phoneNumber').value;
                const banType = document.querySelector('input[name="banType"]:checked');
                
                if (!banType) {
                    showNotification('Pilih jenis ban terlebih dahulu!');
                    return;
                }
                
                // Format nomor telepon
                const formattedNumber = phoneNumber.replace(/\D/g, '');
                
                // Buat pesan email sesuai jenis ban
                let subject, body;
                
                if (banType.value === 'Spam Ban') {
                    subject = `Permohonan Unban WhatsApp - Spam Ban`;
                    body = `Hallo team WhatsApp,\n\nakun saya nomer ${formattedNumber} di blokir.\n\nsaya meminta anda untuk mengembalikan akun WhatsApp saya,\n\nsaya mohon kembalikan.\n\nkarena itu akun pribadi WhatsApp saya.\n\nsekali lagi tolong unbanned akun saya nomer ${formattedNumber}\n\nTerima kasih.`;
                } else if (banType.value === 'Ban Permanen') {
                    subject = `Permohonan Unban WhatsApp - Ban Permanen`;
                    body = `Hallo team WhatsApp,\n\nMohon aktifkan kembali nomor saya ${formattedNumber} karena saya tidak melanggar aturan WhatsApp, tiba-tiba nomor saya di banned, mohon aktifkan kembali nomor ini: ${formattedNumber}\n\nkarena saya tidak melakukan kesalahan apapun, tiba-tiba nomor saya di ban ketika saya melihat status, maka saya meminta kepada pihak whatsapp yang terhormat, tolong aktifkan kembali nomor saya, terima kasih.`;
                }
                
                // Tampilkan loading
                document.getElementById('loading').style.display = 'block';
                
                // Simulasi proses loading
                setTimeout(() => {
                    // Sembunyikan loading
                    document.getElementById('loading').style.display = 'none';
                    
                    // Encode subject dan body
                    const encodedSubject = encodeURIComponent(subject);
                    const encodedBody = encodeURIComponent(body);
                    
                    // Deteksi platform
                    const isAndroid = /Android/i.test(navigator.userAgent);
                    
                    if (isAndroid) {
                        // Coba buka aplikasi Gmail menggunakan intent URL
                        const gmailIntent = `intent://send/#Intent;` +
                            `scheme=mailto;` +
                            `package=com.google.android.gm;` +
                            `S.to=support@support.whatsapp.com;` +
                            `S.subject=${encodedSubject};` +
                            `S.body=${encodedBody};` +
                            `end;`;
                        
                        // Coba buka intent Gmail
                        window.open(gmailIntent, '_blank');
                        
                        // Fallback jika gagal
                        setTimeout(() => {
                            // Coba dengan mailto biasa
                            const mailtoLink = `mailto:support@support.whatsapp.com?subject=${encodedSubject}&body=${encodedBody}`;
                            window.location.href = mailtoLink;
                        }, 1000);
                    } else {
                        // Untuk platform lain, gunakan mailto biasa
                        const mailtoLink = `mailto:support@support.whatsapp.com?subject=${encodedSubject}&body=${encodedBody}`;
                        window.location.href = mailtoLink;
                    }
                    
                    // Tampilkan notifikasi
                    showNotification('Membuka aplikasi Gmail untuk mengirim permintaan unban...');
                }, 1500);
            });
        });
        
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
